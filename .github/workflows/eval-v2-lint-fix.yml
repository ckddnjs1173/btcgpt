name: Temporary Evaluation V2 Lint Fix

on:
  push:
    branches:
      - agent/evaluation-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/evaluation-v2
      - name: Fix lint findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/src/evaluation-v2.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "    const ageMs = item[0];\n    const markPrice = item[1];",
              "    const ageMs: unknown = item[0];\n    const markPrice: unknown = item[1];",
              1,
          )
          text = text.replace(
              "      invalidationHitMs = ageMs;\n      matchedAtMs = null;\n      break;",
              "      invalidationHitMs = ageMs;\n      break;",
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write worker/src/evaluation-v2.ts
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/evaluation-v2.ts
          git commit -m "fix: satisfy Evaluation V2 lint rules" || exit 0
          git push origin HEAD:agent/evaluation-v2
