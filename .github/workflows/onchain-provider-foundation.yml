name: Temporary On-chain Provider Foundation

on:
  push:
    branches:
      - agent/onchain-provider-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/onchain-provider-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Align patch staging
        run: python scripts/tmp-onchain-provider-hotfix.py
      - name: Apply on-chain/provider patch
        run: python scripts/tmp-onchain-provider-foundation.py
      - name: Format changed source
        run: >-
          npx prettier --write
          src/shared/onchain-intelligence.ts
          src/shared/contracts.ts
          src/main/external/provider-contracts.ts
          src/main/external/onchain-v1.ts
          src/main/external/service.ts
          worker/src/index.ts
          worker/src/phase20-context-router.ts
          worker/openapi/openapi.json
          worker/openapi/GPT_INSTRUCTIONS.md
          tests/unit/onchain-provider-foundation.test.ts
          tests/unit/worker.openapi.test.ts
      - name: Validate
        run: npm run check
      - name: Verify formatting
        run: npm run format:check
      - name: Package application
        run: npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src worker tests
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: add on-chain V1 provider foundation"
          git push origin HEAD:agent/onchain-provider-foundation
