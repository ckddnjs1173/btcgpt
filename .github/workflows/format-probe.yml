name: Format Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Print formatted test
        run: |
          npx prettier --write scripts/evidence-ablation-report-lib.test.mjs
          echo '---BEGIN_FORMATTED_TEST---'
          cat scripts/evidence-ablation-report-lib.test.mjs
          echo '---END_FORMATTED_TEST---'
