name: Eval V2 Format Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Prettier
        run: npx prettier --write scripts/evidence-ablation-report-lib.mjs scripts/evidence-ablation-report-lib.test.mjs worker/src/eval-v2-path-summary.ts worker/src/phase25.ts
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet -- scripts/evidence-ablation-report-lib.mjs scripts/evidence-ablation-report-lib.test.mjs worker/src/eval-v2-path-summary.ts worker/src/phase25.ts; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/evidence-ablation-report-lib.mjs scripts/evidence-ablation-report-lib.test.mjs worker/src/eval-v2-path-summary.ts worker/src/phase25.ts
          git commit -m 'style: format eval v2 path quality'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
