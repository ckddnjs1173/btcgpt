name: Temporary Production Readiness Formatter

on:
  push:
    branches:
      - agent/production-readiness
    paths:
      - .github/workflows/tmp-format-production-readiness.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/production-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/production-preflight.mjs scripts/production-postdeploy-smoke.mjs
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production-preflight.mjs scripts/production-postdeploy-smoke.mjs
          git commit -m "style: format production readiness scripts"
          git push origin HEAD:agent/production-readiness
