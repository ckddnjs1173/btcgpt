name: Temporary Coinbase CI Diagnostic

on:
  push:
    branches:
      - agent/coinbase-spot-sensor

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coinbase-spot-sensor
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture validation
        shell: bash
        run: |
          set +e
          npm run check > /tmp/check.log 2>&1
          CHECK=$?
          npm run format:check > /tmp/format.log 2>&1
          FORMAT=$?
          npm run build > /tmp/build.log 2>&1
          BUILD=$?
          {
            echo "CHECK=$CHECK FORMAT=$FORMAT BUILD=$BUILD"
            echo "=== CHECK ==="
            cat /tmp/check.log
            echo "=== FORMAT ==="
            cat /tmp/format.log
            echo "=== BUILD ==="
            cat /tmp/build.log
          } > coinbase-ci-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coinbase-ci-diagnostic.txt
          git commit -m "chore: capture Coinbase CI diagnostic"
          git push origin HEAD:agent/coinbase-spot-sensor
