name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Verify formatting
        run: npm run format:check

      - name: Package application
        run: npm run build
