name: Temporary Evaluation V2 Test Formatter

on:
  push:
    branches:
      - agent/evaluation-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/evaluation-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/worker.phase16-eval-v2.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/worker.phase16-eval-v2.test.ts
          git commit -m "format Evaluation V2 integration test" || exit 0
          git push origin HEAD:agent/evaluation-v2
