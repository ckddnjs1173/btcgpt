name: Temporary Bundle5 Formatter

on:
  push:
    branches:
      - agent/trigger-position-precision

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/trigger-position-precision

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format remaining Bundle 5 files
        run: >-
          npx prettier --write
          tests/unit/worker.openapi.test.ts
          tests/unit/worker.position-adjustment.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/worker.openapi.test.ts tests/unit/worker.position-adjustment.test.ts
          git commit -m "format bundle5 tests"
          git push origin HEAD:agent/trigger-position-precision
