name: Temporary Market Intelligence Formatter

on:
  push:
    branches:
      - agent/data-plane-multicoin

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/data-plane-multicoin

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format changed scope
        run: >-
          npx prettier --write
          AGENTS.md
          docs/MARKET_INTELLIGENCE_V2.md
          src/shared/market-intelligence.ts
          src/main/market/intelligence/freshness.ts
          src/main/market/intelligence/provenance.ts
          src/main/market/multicoin/cache.ts
          tests/unit/market-intelligence-foundation.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/MARKET_INTELLIGENCE_V2.md src/shared/market-intelligence.ts src/main/market/intelligence/freshness.ts src/main/market/intelligence/provenance.ts src/main/market/multicoin/cache.ts tests/unit/market-intelligence-foundation.test.ts
          git commit -m "format market intelligence foundation"
          git push origin HEAD:agent/data-plane-multicoin
