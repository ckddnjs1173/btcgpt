name: Temporary Coinbase Final Formatting

on:
  push:
    branches:
      - agent/coinbase-spot-sensor

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coinbase-spot-sensor
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Coinbase integration files
        shell: bash
        run: |
          npx prettier --write src/main/index.ts src/main/market/cross-venue/coinbase-spot-service.ts src/main/market/intelligence/local-market.ts
          git rm .github/workflows/coinbase-format-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/index.ts src/main/market/cross-venue/coinbase-spot-service.ts src/main/market/intelligence/local-market.ts
          git commit -m "format: normalize Coinbase integration files"
          git push origin HEAD:agent/coinbase-spot-sensor
