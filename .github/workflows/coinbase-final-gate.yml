name: Temporary Coinbase Final Gate

on:
  push:
    branches:
      - agent/coinbase-spot-sensor

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coinbase-spot-sensor
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate
        run: npm run check
      - name: Verify formatting
        run: npm run format:check
      - name: Package application
        run: npm run build
      - name: Remove all temporary Bundle 7-A files
        shell: bash
        run: |
          rm -f coinbase-ci-diagnostic.txt
          git rm -f --ignore-unmatch .github/workflows/coinbase-ci-diagnostic.yml
          git rm -f --ignore-unmatch .github/workflows/coinbase-finalize.yml
          git rm -f --ignore-unmatch .github/workflows/coinbase-cleanup.yml
          git rm -f --ignore-unmatch .github/workflows/coinbase-final-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary Coinbase validation files"
            git push origin HEAD:agent/coinbase-spot-sensor
          fi
      - name: Merge validated PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 26 --repo ckddnjs1173/btcgpt || true
          gh pr merge 26 --repo ckddnjs1173/btcgpt --squash --admin --delete-branch
