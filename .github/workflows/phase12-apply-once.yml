name: Phase 12 apply once

on:
  push:
    branches:
      - finalize-phase12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finalize-phase12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Phase 12 source edits
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const edit = (path, before, after) => {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`missing source in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          };

          edit('src/shared/contracts.ts', 'export interface LockedTradePlan {', `export type ApprovedPlanPriceCondition = 'AT_OR_ABOVE' | 'AT_OR_BELOW';
          export type ApprovedPlanMonitoringState = 'WATCHING' | 'TRIGGERED' | 'INVALIDATED' | 'EXPIRED' | 'CANCELLED';
          export interface ApprovedPlanMonitoring {
            referencePrice: 'MARK_PRICE';
            triggerCondition: ApprovedPlanPriceCondition;
            triggerPrice: number;
            invalidationCondition: ApprovedPlanPriceCondition;
            invalidationPrice: number;
            expiresAt: number;
            state: ApprovedPlanMonitoringState;
            triggeredAt: number | null;
            invalidatedAt: number | null;
            expiredAt: number | null;
            cancelledAt: number | null;
          }

          export interface LockedTradePlan {`);
          edit('src/shared/contracts.ts', '  snapshotId: string;\n  marketGeneratedAt: number;\n  lockedAt: number;\n}', '  snapshotId: string;\n  marketGeneratedAt: number;\n  monitoring?: ApprovedPlanMonitoring;\n  lockedAt: number;\n}');
          edit('src/shared/contracts.ts', '  activePlan: LockedTradePlan | null;\n  activePaperTrade: PaperTrade | null;', '  activePlan: LockedTradePlan | null;\n  lastPlan: LockedTradePlan | null;\n  activePaperTrade: PaperTrade | null;');

          edit('src/main/db/database.ts', "  updateLockedTradePlanStatus(\n    id: string,\n    status: LockedTradePlan['status'],\n  ): void {", `  readLatestLockedTradePlan(mode?: TradingMode): LockedTradePlan | null {
            const row = this.database
              .prepare(\`SELECT payload FROM locked_trade_plans WHERE (? IS NULL OR mode = ?) ORDER BY locked_at DESC LIMIT 1\`)
              .get(mode ?? null, mode ?? null) as { payload: string } | undefined;
            if (!row) return null;
            try { return JSON.parse(row.payload) as LockedTradePlan; } catch { return null; }
          }

          updateLockedTradePlanStatus(
            id: string,
            status: LockedTradePlan['status'],
          ): void {`);

          edit('src/main/ipc/register-handlers.ts', "import { buildTradingState } from '../trading/build-state';\n\ninterface RegisterIpcHandlersOptions {", "import { buildTradingState } from '../trading/build-state';\n\nconst APPROVED_PLAN_DEFAULT_TTL_MS = 30 * 60_000;\n\ninterface RegisterIpcHandlersOptions {");
          edit('src/main/ipc/register-handlers.ts', `      const settings = database.readUserSettings();
                const account = accountService.getStatus();
                const entryFeeRate =`, `      const settings = database.readUserSettings();
                const existingPlan = database.readActiveLockedTradePlan(settings.tradingMode);
                if (existingPlan?.status === 'LOCKED') {
                  const now = Date.now();
                  database.saveLockedTradePlan({
                    ...existingPlan,
                    status: 'CANCELLED',
                    monitoring: existingPlan.monitoring
                      ? { ...existingPlan.monitoring, state: 'CANCELLED', cancelledAt: now }
                      : existingPlan.monitoring,
                  });
                } else if (existingPlan) {
                  throw new Error('ACTIVE_TRADE_PLAN_EXISTS');
                }
                const account = accountService.getStatus();
                const entryFeeRate =`);
          edit('src/main/ipc/register-handlers.ts', '      const result = validatePositionPlan(input);', `      const referencePrice = snapshot.marketState.markPrice ?? snapshot.marketState.lastPrice;
                if (!referencePrice) throw new Error('PLAN_REFERENCE_PRICE_REQUIRED');
                const result = validatePositionPlan(input);`);
          edit('src/main/ipc/register-handlers.ts', '      const plan: LockedTradePlan = {\n        id: randomUUID(),', '      const lockedAt = Date.now();\n      const plan: LockedTradePlan = {\n        id: randomUUID(),');
          edit('src/main/ipc/register-handlers.ts', '        snapshotId: snapshot.snapshotId,\n        marketGeneratedAt: snapshot.generatedAt,\n        lockedAt: Date.now(),', `        snapshotId: snapshot.snapshotId,
                marketGeneratedAt: snapshot.generatedAt,
                monitoring: {
                  referencePrice: 'MARK_PRICE',
                  triggerCondition: input.entry >= referencePrice ? 'AT_OR_ABOVE' : 'AT_OR_BELOW',
                  triggerPrice: input.entry,
                  invalidationCondition: input.stop >= referencePrice ? 'AT_OR_ABOVE' : 'AT_OR_BELOW',
                  invalidationPrice: input.stop,
                  expiresAt: lockedAt + APPROVED_PLAN_DEFAULT_TTL_MS,
                  state: 'WATCHING',
                  triggeredAt: null,
                  invalidatedAt: null,
                  expiredAt: null,
                  cancelledAt: null,
                },
                lockedAt,`);
          edit('src/main/ipc/register-handlers.ts', "    if (!plan || plan.status !== 'LOCKED')\n      throw new Error('PAPER_PLAN_REQUIRED');\n    if (database.readActivePaperTrade())", "    if (!plan || plan.status !== 'LOCKED')\n      throw new Error('PAPER_PLAN_REQUIRED');\n    if (plan.monitoring?.state !== 'TRIGGERED')\n      throw new Error('PAPER_PLAN_TRIGGER_REQUIRED');\n    if (database.readActivePaperTrade())");

          edit('src/main/index.ts', "import { buildTradingState } from './trading/build-state';", "import { buildTradingState } from './trading/build-state';\nimport { ApprovedPlanMonitor } from './trading/approved-plan-monitor';");
          edit('src/main/index.ts', 'let notificationMonitor: OperationalNotificationMonitor | null = null;\nlet externalContext: ExternalContextService | null = null;', 'let notificationMonitor: OperationalNotificationMonitor | null = null;\nlet approvedPlanMonitor: ApprovedPlanMonitor | null = null;\nlet externalContext: ExternalContextService | null = null;');
          edit('src/main/index.ts', '  notificationMonitor?.stop();\n  notificationMonitor = null;\n  accountService?.stop();', '  approvedPlanMonitor?.stop();\n  approvedPlanMonitor = null;\n  notificationMonitor?.stop();\n  notificationMonitor = null;\n  accountService?.stop();');
          edit('src/main/index.ts', "  notificationMonitor.start();\n\n  powerMonitor.on('resume', () => {", "  notificationMonitor.start();\n  approvedPlanMonitor = new ApprovedPlanMonitor(database, () =>\n    generateSnapshot(marketData!.cache, getSnapshotOptions()),\n  );\n  approvedPlanMonitor.start();\n\n  powerMonitor.on('resume', () => {");

          edit('src/renderer/App.tsx', "      setResult({ ok: true, message: '검증된 진입 전 계획을 고정했습니다.' });", "      setResult({ ok: true, message: '검증된 계획을 고정하고 30분 객관 가격 감시를 시작했습니다.' });");
          edit('src/renderer/App.tsx', `          {settings.tradingMode === 'PAPER' &&
                    snapshot?.trading.activePlan?.status === 'LOCKED' && (
                      <button onClick={() => void enterPaperTrade()}>
                        고정 계획으로 PAPER 진입
                      </button>
                    )}`, `          {settings.tradingMode === 'PAPER' &&
                    snapshot?.trading.activePlan?.status === 'LOCKED' &&
                    snapshot.trading.activePlan.monitoring?.state === 'TRIGGERED' && (
                      <button onClick={() => void enterPaperTrade()}>
                        트리거 충족 계획으로 PAPER 진입
                      </button>
                    )}`);
          NODE
          npm run format
      - name: Commit Phase 12 edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: persist approved plan monitoring state"
          git push origin HEAD:finalize-phase12
