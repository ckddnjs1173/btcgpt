name: Phase 12 final fixup

on:
  push:
    branches:
      - finalize-phase12

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finalize-phase12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply validated-plan replacement fix
        run: node scripts/phase12-fixup.cjs
