name: Temporary Auxiliary Telemetry Patch

on:
  push:
    branches:
      - agent/aux-operational-telemetry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/aux-operational-telemetry
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch lead, alt, and Coinbase telemetry
