              path = Path(pathname)
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{pathname}: anchor count {count} for {old[:100]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

