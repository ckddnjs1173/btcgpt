name: Temporary Final GPT Instruction Trim

on:
  push:
    branches:
      - agent/coinbase-spot-sensor

permissions:
  contents: write

jobs:
  trim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coinbase-spot-sensor
      - name: Trim instruction wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/openapi/GPT_INSTRUCTIONS.md')
          text = p.read_text(encoding='utf-8')
          old = '- `crossMarket`: Worker 저빈도 corroboration.'
          new = '- `crossMarket`: 저빈도 corroboration.'
          if old not in text:
              raise SystemExit('trim anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/gpt-instruction-trim-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/openapi/GPT_INSTRUCTIONS.md
          git commit -m "docs: keep Coinbase instructions within limit"
          git push origin HEAD:agent/coinbase-spot-sensor
