name: Temporary Coinbase Finalizer

on:
  push:
    branches:
      - agent/coinbase-spot-sensor

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coinbase-spot-sensor
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Bundle 7-A files
        run: >-
          npx prettier --write
          src/shared/cross-venue-intelligence.ts
          src/shared/decision-context.ts
          src/main/index.ts
          src/main/market/intelligence/local-market.ts
          src/main/market/intelligence/cross-venue.ts
          src/main/market/cross-venue/coinbase-spot-accumulator.ts
          src/main/market/cross-venue/coinbase-spot-service.ts
          worker/openapi/openapi.json
          worker/openapi/GPT_INSTRUCTIONS.md
          tests/unit/coinbase-spot-sensor.test.ts
          tests/unit/cross-venue-intelligence.test.ts
          tests/unit/worker.openapi.test.ts
      - name: Validate repository
        run: npm run check
      - name: Package Electron app
        run: npm run build
      - name: Remove temporary diagnostics and commit final formatting
        shell: bash
        run: |
          rm -f coinbase-ci-diagnostic.txt
          git rm -f --ignore-unmatch .github/workflows/coinbase-ci-diagnostic.yml
          git rm -f --ignore-unmatch .github/workflows/coinbase-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src worker tests
          if git diff --cached --quiet; then
            echo "No final changes"
          else
            git commit -m "chore: finalize Coinbase spot sensor"
            git push origin HEAD:agent/coinbase-spot-sensor
          fi
