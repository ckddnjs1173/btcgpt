name: Temporary Instruction Trim

on:
  push:
    branches:
      - agent/latency-soak-hardening
    paths:
      - .github/workflows/tmp-instruction-trim.yml

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/latency-soak-hardening
      - name: Trim canonical instruction wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/openapi/GPT_INSTRUCTIONS.md')
          s = p.read_text()
          old = '- snapshotId/marketGeneratedAt/contextGeneratedAt은 사용한 Decision Context 값 그대로.'
          new = '- snapshotId/marketGeneratedAt/contextGeneratedAt은 같은 Decision Context 값 사용.'
          if s.count(old) != 1:
              raise SystemExit('instruction trim anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit trim
        run: |
          git config user.name "ckddnjs1173"
          git config user.email "ckddnjs0929@gmail.com"
          git add worker/openapi/GPT_INSTRUCTIONS.md
          git commit -m "docs: trim latency instruction wording"
          git push
