name: Temporary Coinbase Lint Cleanup

on:
  push:
    branches:
      - agent/coinbase-spot-sensor

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coinbase-spot-sensor
      - name: Remove dead helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main/market/cross-venue/coinbase-spot-service.ts')
          text = p.read_text(encoding='utf-8')
          block = """function isProduct(value: string): value is CoinbaseSpotProduct {\n  return (COINBASE_SPOT_PRODUCTS as readonly string[]).includes(value);\n}\n\n"""
          if block not in text:
              raise SystemExit('isProduct helper not found')
          p.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY
          git rm .github/workflows/coinbase-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/market/cross-venue/coinbase-spot-service.ts
          git commit -m "fix: remove unused Coinbase helper"
          git push origin HEAD:agent/coinbase-spot-sensor
