name: GPT Policy Format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Prettier
        run: npx prettier --write docs/GPT_POLICY_EVAL_MATRIX.md research/gpt-policies/gpt-policy-v2.md tests/unit/gpt-policy-contract.test.ts
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet -- docs/GPT_POLICY_EVAL_MATRIX.md research/gpt-policies/gpt-policy-v2.md tests/unit/gpt-policy-contract.test.ts; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/GPT_POLICY_EVAL_MATRIX.md research/gpt-policies/gpt-policy-v2.md tests/unit/gpt-policy-contract.test.ts
          git commit -m 'style: format GPT policy evaluation files'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
