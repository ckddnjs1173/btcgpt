name: Version once

on:
  push:
    branches:
      - finalize-v0.5.6

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: finalize-v0.5.6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Set application version
        run: |
          npm version 0.5.6 --no-git-tag-version
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'src/renderer/App.tsx';
          const source = fs.readFileSync(path, 'utf8');
          fs.writeFileSync(
            path,
            source.replace("snapshot?.appVersion ?? '0.5.4'", "snapshot?.appVersion ?? '0.5.6'"),
          );
          NODE
          npm run format

      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/renderer/App.tsx
          git commit -m "chore: bump app version to 0.5.6"
          git push origin HEAD:finalize-v0.5.6
