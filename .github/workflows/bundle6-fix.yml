name: Temporary Evaluation V2 Fix

on:
  push:
    branches:
      - agent/evaluation-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/evaluation-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/tmp-bundle6-fix.py
      - run: npx prettier --write worker/src/phase16-eval.ts tests/unit/worker.openapi.test.ts
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/phase16-eval.ts tests/unit/worker.openapi.test.ts
          git commit -m "fix: preserve eval-v1 compatibility" || exit 0
          git push origin HEAD:agent/evaluation-v2
