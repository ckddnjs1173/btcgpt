name: Temporary Ablation Formatter

on:
  push:
    branches: [agent/evidence-ablation-campaigns]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/evidence-ablation-campaigns
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          scripts/evidence-ablation-lib.mjs
          scripts/evidence-ablation-lib.test.mjs
          scripts/evidence-ablation-prepare.mjs
          scripts/replay-batch-prepare.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/evidence-ablation-lib.mjs scripts/evidence-ablation-lib.test.mjs scripts/evidence-ablation-prepare.mjs scripts/replay-batch-prepare.mjs
          git commit -m "style: format evidence ablation scripts"
          git push
