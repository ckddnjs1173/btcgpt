name: Temporary Transport Latency Hardening

on:
  push:
    branches:
      - agent/latency-soak-hardening
    paths:
      - .github/workflows/tmp-latency-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/latency-soak-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/tmp-latency-hardening.py
      - run: npx prettier --write src/shared/contracts.ts src/main/relay/uploader.ts worker/src/phase13.ts tests/unit/worker.phase13.test.ts tests/unit/relay.uploader.test.ts worker/openapi/openapi.json tests/unit/worker.openapi.test.ts worker/openapi/GPT_INSTRUCTIONS.md docs/TRANSPORT_LATENCY_TELEMETRY.md
      - name: Commit patch
        run: |
          git config user.name "ckddnjs1173"
          git config user.email "ckddnjs0929@gmail.com"
          git add src/shared/contracts.ts src/main/relay/uploader.ts worker/src/phase13.ts tests/unit/worker.phase13.test.ts tests/unit/relay.uploader.test.ts worker/openapi/openapi.json tests/unit/worker.openapi.test.ts worker/openapi/GPT_INSTRUCTIONS.md docs/TRANSPORT_LATENCY_TELEMETRY.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: add end-to-end transport latency telemetry"
          git push
