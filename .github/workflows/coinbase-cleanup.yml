name: Temporary Coinbase Cleanup

on:
  push:
    branches:
      - agent/coinbase-spot-sensor

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coinbase-spot-sensor
      - name: Remove temporary files
        shell: bash
        run: |
          rm -f coinbase-ci-diagnostic.txt
          git rm -f --ignore-unmatch .github/workflows/coinbase-ci-diagnostic.yml
          git rm -f --ignore-unmatch .github/workflows/coinbase-finalize.yml
          git rm -f --ignore-unmatch .github/workflows/coinbase-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "chore: remove temporary Coinbase validation files"
          git push origin HEAD:agent/coinbase-spot-sensor
