name: Research Finalization Format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply Prettier
        run: npx prettier --write scripts/research-finalize-lib.mjs scripts/research-finalize-lib.test.mjs scripts/research-finalize.mjs tests/unit/research-decision-cohorts.test.ts worker/src/phase25.ts worker/src/research-decision-cohorts.ts
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet -- scripts/research-finalize-lib.mjs scripts/research-finalize-lib.test.mjs scripts/research-finalize.mjs tests/unit/research-decision-cohorts.test.ts worker/src/phase25.ts worker/src/research-decision-cohorts.ts; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/research-finalize-lib.mjs scripts/research-finalize-lib.test.mjs scripts/research-finalize.mjs tests/unit/research-decision-cohorts.test.ts worker/src/phase25.ts worker/src/research-decision-cohorts.ts
          git commit -m 'style: format research finalization'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
