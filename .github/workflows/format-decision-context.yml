name: Temporary Decision Context Formatter

on:
  push:
    branches:
      - agent/decision-context-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/decision-context-v1

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format Decision Context files
        run: >-
          npx prettier --write
          tests/unit/decision-context-v1.test.ts
          tests/unit/worker.openapi.test.ts
          worker/openapi/openapi.json
          worker/src/decision-context-route.ts
          worker/src/decision-context.ts
          worker/src/relay-freshness.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/decision-context-v1.test.ts tests/unit/worker.openapi.test.ts worker/openapi/openapi.json worker/src/decision-context-route.ts worker/src/decision-context.ts worker/src/relay-freshness.ts
          git commit -m "format decision context files"
          git push origin HEAD:agent/decision-context-v1
