name: Temporary Coinbase Contract Patch

on:
  push:
    branches:
      - agent/coinbase-spot-sensor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/coinbase-spot-sensor
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/tmp-coinbase-contract-patch.py
      - run: >-
          npx prettier --write
          src/shared/decision-context.ts
          worker/openapi/openapi.json
          worker/openapi/GPT_INSTRUCTIONS.md
          tests/unit/worker.openapi.test.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/decision-context.ts worker/openapi/openapi.json worker/openapi/GPT_INSTRUCTIONS.md tests/unit/worker.openapi.test.ts
          git commit -m "feat: expose local cross-venue evidence to GPT" || exit 0
          git push origin HEAD:agent/coinbase-spot-sensor
