name: Format Preview

on:
  push:
    branches:
      - feat/binance-readonly-contracts

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print formatted service
        run: npm exec prettier -- src/main/binance/account/service.ts
      - name: Print formatted relay test
        run: npm exec prettier -- tests/unit/relay.uploader.test.ts
