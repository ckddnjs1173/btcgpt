name: Temporary Evaluation V2 Patcher

on:
  push:
    branches:
      - agent/evaluation-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/evaluation-v2

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply Evaluation V2 patch
        run: python scripts/tmp-bundle6-patch.py

      - name: Format changed files
        run: >-
          npx prettier --write
          worker/src/phase16-replay.ts
          worker/src/phase16-eval.ts
          worker/src/phase13.ts
          worker/src/evaluation-v2.ts
          worker/openapi/openapi.json
          worker/openapi/GPT_INSTRUCTIONS.md
          tests/unit/worker.phase16-replay.test.ts
          tests/unit/worker.phase16-eval.test.ts
          tests/unit/evaluation-v2.test.ts

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker tests
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: wire Evaluation V2 replay and scoring"
          git push origin HEAD:agent/evaluation-v2
