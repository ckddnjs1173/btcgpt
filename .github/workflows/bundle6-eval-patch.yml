name: Temporary Evaluation V2 Patcher

on:
  push:
    branches:
      - agent/evaluation-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/evaluation-v2

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Patch replay, evaluator, telemetry and OpenAPI
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing block in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # --- replay-v1 storage is extended without changing frozen input version ---
          p = Path('worker/src/phase16-replay.ts')
          text = p.read_text(encoding='utf-8')
          if "from './evaluation-v2'" not in text:
              text = text.replace(
                  "import type { Env } from './index';\n",
                  "import type { Env } from './index';\nimport {\n  evaluateEnterPlan,\n  evaluateManagementDecision,\n  evaluateWaitTrigger,\n  parsePricePathJson,\n  type PricePathPoint,\n} from './evaluation-v2';\nimport { structuredTriggerInputSchema } from '../../src/shared/trading/structured-trigger';\n",
                  1,
              )
          text = text.replace(
              """const OUTCOME_HORIZONS = [\n  ['5m', 5 * 60_000],\n  ['15m', 15 * 60_000],\n  ['30m', 30 * 60_000],\n  ['60m', 60 * 60_000],\n] as const;""",
              """const OUTCOME_HORIZONS = [\n  ['1m', 60_000],\n  ['3m', 3 * 60_000],\n  ['5m', 5 * 60_000],\n  ['15m', 15 * 60_000],\n  ['30m', 30 * 60_000],\n  ['60m', 60 * 60_000],\n] as const;""",
              1,
          )
          text = text.replace(
              """  maxUpBps5m: number | null;\n  maxDownBps5m: number | null;\n  returnBps5m: number | null;\n  returnObservedAt5m: number | null;""",
              """  maxUpBps1m: number | null;\n  maxDownBps1m: number | null;\n  returnBps1m: number | null;\n  returnObservedAt1m: number | null;\n  maxUpBps3m: number | null;\n  maxDownBps3m: number | null;\n  returnBps3m: number | null;\n  returnObservedAt3m: number | null;\n  maxUpBps5m: number | null;\n  maxDownBps5m: number | null;\n  returnBps5m: number | null;\n  returnObservedAt5m: number | null;""",
              1,
          )
          text = text.replace(
              """  returnBps60m: number | null;\n  returnObservedAt60m: number | null;\n  finalizedAt: number | null;""",
              """  returnBps60m: number | null;\n  returnObservedAt60m: number | null;\n  pricePathVersion: string;\n  pricePathJson: string;\n  lastPathObservedAt: number | null;\n  finalizedAt: number | null;""",
              1,
          )
          marker = """function horizonAssignments(\n  suffix: (typeof OUTCOME_HORIZONS)[number][0],\n  horizonMs: number,\n): string {"""
          if marker not in text:
              raise SystemExit('missing horizonAssignments marker')
          path_helper = """function pricePathAssignments(): string {\n  const age = '(?1 - market_generated_at)';\n  const interval = `CASE\n    WHEN ${age} <= ${5 * 60_000} THEN 5000\n    WHEN ${age} <= ${15 * 60_000} THEN 15000\n    ELSE 30000 END`;\n  const due = `(${age} > 0 AND ${age} <= ${60 * 60_000}\n    AND (last_path_observed_at IS NULL OR (?1 - last_path_observed_at) >= (${interval})))`;\n  return `\n    price_path_json=CASE WHEN ${due}\n      THEN json_insert(COALESCE(price_path_json, '[]'), '$[#]', json_array(${age}, ?2))\n      ELSE price_path_json END,\n    last_path_observed_at=CASE WHEN ${due}\n      THEN ?1 ELSE last_path_observed_at END`;\n}\n\n"""
          if 'function pricePathAssignments()' not in text:
              text = text.replace(marker, path_helper + marker, 1)
          text = text.replace(
              """  const assignments = OUTCOME_HORIZONS.map(([suffix, horizonMs]) =>\n    horizonAssignments(suffix, horizonMs),\n  ).join(',');\n  const result = await env.DB.prepare(\n    `UPDATE replay_case_outcomes SET\n      first_future_observed_at=COALESCE(first_future_observed_at, ?1),\n      last_future_observed_at=?1,\n      sample_count=sample_count + 1,\n      ${assignments},\n      finalized_at=CASE""",
              """  const assignments = OUTCOME_HORIZONS.map(([suffix, horizonMs]) =>\n    horizonAssignments(suffix, horizonMs),\n  ).join(',');\n  const pathAssignments = pricePathAssignments();\n  const result = await env.DB.prepare(\n    `UPDATE replay_case_outcomes SET\n      first_future_observed_at=COALESCE(first_future_observed_at, ?1),\n      last_future_observed_at=?1,\n      sample_count=sample_count + 1,\n      ${assignments},\n      ${pathAssignments},\n      finalized_at=CASE""",
              1,
          )
          # read outcome SELECT new horizons and path.
          text = text.replace(
              """      sample_count AS sampleCount,\n      max_up_bps_5m AS maxUpBps5m, max_down_bps_5m AS maxDownBps5m,""",
              """      sample_count AS sampleCount,\n      max_up_bps_1m AS maxUpBps1m, max_down_bps_1m AS maxDownBps1m,\n      return_bps_1m AS returnBps1m, return_observed_at_1m AS returnObservedAt1m,\n      max_up_bps_3m AS maxUpBps3m, max_down_bps_3m AS maxDownBps3m,\n      return_bps_3m AS returnBps3m, return_observed_at_3m AS returnObservedAt3m,\n      max_up_bps_5m AS maxUpBps5m, max_down_bps_5m AS maxDownBps5m,""",
              1,
          )
          text = text.replace(
              """      return_bps_60m AS returnBps60m, return_observed_at_60m AS returnObservedAt60m,\n      finalized_at AS finalizedAt""",
              """      return_bps_60m AS returnBps60m, return_observed_at_60m AS returnObservedAt60m,\n      price_path_version AS pricePathVersion, price_path_json AS pricePathJson,\n      last_path_observed_at AS lastPathObservedAt, finalized_at AS finalizedAt""",
              1,
          )
          # Original-decision V2 evaluation helper.
          before_read = """async function readReplayOutcome(\n  env: Env,\n  decisionId: string,\n): Promise<Response> {"""
          helper = r'''function decisionEvaluationV2(input: {
  decision: DecisionOutcomeRow;
  outcome: ReplayOutcomeRow | null;
  tradeQuality: TradeQualityRow | null;
}): unknown {
  const { decision, outcome, tradeQuality } = input;
  if (!outcome || outcome.anchorMarkPrice === null)
    return { available: false, reason: 'OUTCOME_UNAVAILABLE' };
  const pricePath = parsePricePathJson(outcome.pricePathJson);
  if (pricePath.length === 0)
    return { available: false, reason: 'PRICE_PATH_UNAVAILABLE' };
  const payload = asRecord(safeParse(decision.payload));
  const side =
    decision.side === 'LONG' || decision.side === 'SHORT'
      ? decision.side
      : 'NEUTRAL';

  if (decision.decision === 'ENTER_NOW' && side !== 'NEUTRAL') {
    const entry = asNumber(payload?.entry);
    const stop = asNumber(payload?.stop);
    const targets = Array.isArray(payload?.targets)
      ? payload.targets.map(asNumber).filter((value): value is number => value !== null)
      : [];
    if (entry === null || stop === null || targets.length === 0)
      return { available: false, reason: 'PLAN_UNAVAILABLE' };
    return evaluateEnterPlan({
      side,
      anchorMarkPrice: outcome.anchorMarkPrice,
      entry,
      stop,
      targets,
      pricePath,
      realizedNetR: tradeQuality?.realizedNetR ?? null,
      entryDriftBps: tradeQuality?.entryDriftBps ?? null,
    });
  }

  if (decision.decision === 'WAIT_TRIGGER') {
    const parsedTrigger = structuredTriggerInputSchema.safeParse(payload?.triggerContract);
    if (!parsedTrigger.success)
      return { available: false, reason: 'STRUCTURED_TRIGGER_UNAVAILABLE' };
    return evaluateWaitTrigger({
      side,
      marketGeneratedAt: outcome.marketGeneratedAt,
      anchorMarkPrice: outcome.anchorMarkPrice,
      triggerContract: parsedTrigger.data,
      pricePath,
    });
  }

  if (
    decision.decision === 'HOLD' ||
    decision.decision === 'PARTIAL_EXIT' ||
    decision.decision === 'EXIT' ||
    decision.decision === 'MOVE_STOP' ||
    decision.decision === 'CHANGE_TP'
  ) {
    return evaluateManagementDecision({
      decision: decision.decision,
      side,
      anchorMarkPrice: outcome.anchorMarkPrice,
      pricePath,
      realizedNetR: tradeQuality?.realizedNetR ?? null,
    });
  }

  return {
    available: true,
    decision: decision.decision,
    performanceScored: false,
    note:
      decision.decision === 'NO_TRADE'
        ? 'NO_TRADE is described by future opportunity vectors; no scalar penalty is assigned.'
        : 'DATA_BLOCKED is counted but not performance-scored.',
  };
}

'''
          if 'function decisionEvaluationV2' not in text:
              text = text.replace(before_read, helper + before_read, 1)
          text = text.replace(
              """    futurePath: outcome,\n    tradeQuality,\n    samplingBasis: 'RELAY_MARK_PRICE',""",
              """    futurePath: outcome\n      ? {\n          ...outcome,\n          pricePath: parsePricePathJson(outcome.pricePathJson),\n        }\n      : null,\n    tradeQuality,\n    evaluationV2: decisionEvaluationV2({ decision, outcome, tradeQuality }),\n    samplingBasis: 'RELAY_MARK_PRICE',""",
              1,
          )
          p.write_text(text, encoding='utf-8')

          # --- decision telemetry carries the exact GPT-authored trigger contract ---
          p = Path('worker/src/phase13.ts')
          text = p.read_text(encoding='utf-8')
          if 'structuredTriggerInputSchema' not in text:
              text = text.replace(
                  "import { z } from 'zod';\n",
                  "import { z } from 'zod';\n\nimport { structuredTriggerInputSchema } from '../../src/shared/trading/structured-trigger';\n",
                  1,
              )
          text = text.replace(
              """    triggerSummary: z.string().trim().max(300).nullable().optional(),\n    invalidationSummary: z.string().trim().max(300).nullable().optional(),""",
              """    triggerSummary: z.string().trim().max(300).nullable().optional(),\n    triggerContract: structuredTriggerInputSchema.nullable().optional(),\n    invalidationSummary: z.string().trim().max(300).nullable().optional(),""",
              1,
          )
          refine_anchor = """    if (decision.decision === 'ENTER_NOW') {"""
          refine_add = """    if (decision.triggerContract) {\n      if (decision.decision !== 'WAIT_TRIGGER') {\n        context.addIssue({\n          code: 'custom',\n          path: ['triggerContract'],\n          message: 'triggerContract is only valid for WAIT_TRIGGER',\n        });\n      }\n      if (decision.triggerContract.decisionId !== decision.decisionId) {\n        context.addIssue({\n          code: 'custom',\n          path: ['triggerContract', 'decisionId'],\n          message: 'triggerContract decisionId must match decisionId',\n        });\n      }\n      if (decision.triggerContract.sourceSnapshotId !== decision.snapshotId) {\n        context.addIssue({\n          code: 'custom',\n          path: ['triggerContract', 'sourceSnapshotId'],\n          message: 'triggerContract sourceSnapshotId must match snapshotId',\n        });\n      }\n    }\n    if (decision.decision === 'ENTER_NOW') {"""
          if refine_anchor in text and "triggerContract is only valid" not in text:
              text = text.replace(refine_anchor, refine_add, 1)
          p.write_text(text, encoding='utf-8')

          # --- eval runner supports immutable eval-v1 plus new eval-v2 ---
          p = Path('worker/src/phase16-eval.ts')
          text = p.read_text(encoding='utf-8')
          if "from './evaluation-v2'" not in text:
              text = text.replace(
                  "import { REPLAY_CASE_VERSION } from './phase16-replay';\n",
                  "import { REPLAY_CASE_VERSION } from './phase16-replay';\nimport {\n  EVALUATION_V2_VERSION,\n  evaluateEnterPlan,\n  evaluateManagementDecision,\n  evaluateWaitTrigger,\n  parsePricePathJson,\n} from './evaluation-v2';\nimport { structuredTriggerInputSchema } from '../../src/shared/trading/structured-trigger';\n",
                  1,
              )
          text = text.replace(
              "export const EVALUATOR_VERSION = 'eval-v1';",
              "export const EVALUATOR_VERSION = EVALUATION_V2_VERSION;\nconst evaluatorVersionSchema = z.enum(['eval-v1', 'eval-v2']);",
              1,
          )
          text = text.replace(
              "evaluatorVersion: z.literal(EVALUATOR_VERSION).default(EVALUATOR_VERSION),",
              "evaluatorVersion: evaluatorVersionSchema.default(EVALUATOR_VERSION),",
              1,
          )
          text = text.replace(
              "outputVersion: z.literal('eval-output-v1').default('eval-output-v1'),",
              "outputVersion: z\n      .enum(['eval-output-v1', 'eval-output-v2'])\n      .default('eval-output-v2'),",
              1,
          )
          text = text.replace(
              """    triggerSummary: z.string().trim().max(300).nullable().optional(),\n    invalidationSummary: z.string().trim().max(300).nullable().optional(),""",
              """    triggerSummary: z.string().trim().max(300).nullable().optional(),\n    triggerContract: structuredTriggerInputSchema.nullable().optional(),\n    invalidationSummary: z.string().trim().max(300).nullable().optional(),""",
              1,
          )
          super_anchor = """  .superRefine((output, context) => {\n    if (output.decision !== 'ENTER_NOW') return;"""
          super_new = """  .superRefine((output, context) => {\n    if (\n      output.outputVersion === 'eval-output-v2' &&\n      output.decision === 'WAIT_TRIGGER' &&\n      !output.triggerContract\n    ) {\n      context.addIssue({\n        code: 'custom',\n        path: ['triggerContract'],\n        message: 'eval-output-v2 WAIT_TRIGGER requires triggerContract',\n      });\n    }\n    if (output.triggerContract && output.decision !== 'WAIT_TRIGGER') {\n      context.addIssue({\n        code: 'custom',\n        path: ['triggerContract'],\n        message: 'triggerContract is only valid for WAIT_TRIGGER',\n      });\n    }\n    if (output.decision !== 'ENTER_NOW') return;"""
          if super_anchor not in text:
              raise SystemExit('missing eval superRefine anchor')
          text = text.replace(super_anchor, super_new, 1)
          text = text.replace(
              "type HorizonKey = '5m' | '15m' | '30m' | '60m';",
              "type HorizonKey = '1m' | '3m' | '5m' | '15m' | '30m' | '60m';",
              1,
          )
          text = text.replace(
              """type OutcomeRow = {\n  finalizedAt: number | null;\n  maxUpBps5m: number | null;""",
              """type OutcomeRow = {\n  finalizedAt: number | null;\n  anchorMarkPrice: number | null;\n  marketGeneratedAt: number;\n  maxUpBps1m: number | null;\n  maxDownBps1m: number | null;\n  returnBps1m: number | null;\n  maxUpBps3m: number | null;\n  maxDownBps3m: number | null;\n  returnBps3m: number | null;\n  maxUpBps5m: number | null;""",
              1,
          )
          text = text.replace(
              """  returnBps60m: number | null;\n};""",
              """  returnBps60m: number | null;\n  pricePathJson: string;\n};""",
              1,
          )
          # loadOutcome select.
          text = text.replace(
              """      `SELECT finalized_at AS finalizedAt,\n        max_up_bps_5m AS maxUpBps5m,""",
              """      `SELECT finalized_at AS finalizedAt,\n        market_generated_at AS marketGeneratedAt,\n        anchor_mark_price AS anchorMarkPrice,\n        max_up_bps_1m AS maxUpBps1m,\n        max_down_bps_1m AS maxDownBps1m,\n        return_bps_1m AS returnBps1m,\n        max_up_bps_3m AS maxUpBps3m,\n        max_down_bps_3m AS maxDownBps3m,\n        return_bps_3m AS returnBps3m,\n        max_up_bps_5m AS maxUpBps5m,""",
              1,
          )
          text = text.replace(
              """        max_down_bps_60m AS maxDownBps60m,\n        return_bps_60m AS returnBps60m\n       FROM replay_case_outcomes""",
              """        max_down_bps_60m AS maxDownBps60m,\n        return_bps_60m AS returnBps60m,\n        price_path_json AS pricePathJson\n       FROM replay_case_outcomes""",
              1,
          )
          # horizonValues 1m/3m branches.
          h_anchor = """function horizonValues(\n  outcome: OutcomeRow,\n  horizon: HorizonKey,\n): { rawReturn: number | null; maxUp: number | null; maxDown: number | null } {\n  if (horizon === '5m') {"""
          h_new = """function horizonValues(\n  outcome: OutcomeRow,\n  horizon: HorizonKey,\n): { rawReturn: number | null; maxUp: number | null; maxDown: number | null } {\n  if (horizon === '1m') {\n    return {\n      rawReturn: outcome.returnBps1m,\n      maxUp: outcome.maxUpBps1m,\n      maxDown: outcome.maxDownBps1m,\n    };\n  }\n  if (horizon === '3m') {\n    return {\n      rawReturn: outcome.returnBps3m,\n      maxUp: outcome.maxUpBps3m,\n      maxDown: outcome.maxDownBps3m,\n    };\n  }\n  if (horizon === '5m') {"""
          if h_anchor not in text:
              raise SystemExit('missing horizonValues anchor')
          text = text.replace(h_anchor, h_new, 1)

          # Insert V2 scorer immediately before scoreRun.
          score_anchor = """async function scoreRun(\n  env: Env,"""
          v2_scorer = r'''function allHorizonScores(outcome: OutcomeRow, side: EvalOutput['side']) {
  return {
    '1m': scoreHorizon(side, horizonValues(outcome, '1m')),
    '3m': scoreHorizon(side, horizonValues(outcome, '3m')),
    '5m': scoreHorizon(side, horizonValues(outcome, '5m')),
    '15m': scoreHorizon(side, horizonValues(outcome, '15m')),
    '30m': scoreHorizon(side, horizonValues(outcome, '30m')),
    '60m': scoreHorizon(side, horizonValues(outcome, '60m')),
  } satisfies Record<HorizonKey, HorizonScore>;
}

function scoreRunV2FromOutcome(outcome: OutcomeRow, output: EvalOutput) {
  const directionalSide = output.decision === 'ENTER_NOW' ? output.side : 'NEUTRAL';
  const horizons = allHorizonScores(outcome, directionalSide);
  const pricePath = parsePricePathJson(outcome.pricePathJson);
  let decisionEvaluation: unknown;

  if (
    output.decision === 'ENTER_NOW' &&
    output.side !== 'NEUTRAL' &&
    output.entry != null &&
    output.stop != null
  ) {
    decisionEvaluation = evaluateEnterPlan({
      side: output.side,
      anchorMarkPrice: outcome.anchorMarkPrice ?? output.entry,
      entry: output.entry,
      stop: output.stop,
      targets: output.targets,
      pricePath,
    });
  } else if (output.decision === 'WAIT_TRIGGER' && output.triggerContract) {
    decisionEvaluation = evaluateWaitTrigger({
      side: output.side,
      marketGeneratedAt: outcome.marketGeneratedAt,
      anchorMarkPrice: outcome.anchorMarkPrice ?? output.triggerContract.triggerPrice,
      triggerContract: output.triggerContract,
      pricePath,
    });
  } else if (
    output.decision === 'HOLD' ||
    output.decision === 'PARTIAL_EXIT' ||
    output.decision === 'EXIT' ||
    output.decision === 'MOVE_STOP' ||
    output.decision === 'CHANGE_TP'
  ) {
    decisionEvaluation = evaluateManagementDecision({
      decision: output.decision,
      side: output.side,
      anchorMarkPrice: outcome.anchorMarkPrice ?? 0,
      pricePath,
    });
  } else if (output.decision === 'NO_TRADE') {
    decisionEvaluation = {
      available: true,
      performanceScored: false,
      opportunityByHorizon: Object.fromEntries(
        Object.entries(horizons).map(([key, value]) => [key, value.opportunityBps]),
      ),
      note: 'NO_TRADE has no arbitrary scalar penalty.',
    };
  } else {
    decisionEvaluation = {
      available: true,
      performanceScored: false,
      note: 'DATA_BLOCKED is counted but not performance-scored.',
    };
  }

  const score = {
    evaluatorVersion: EVALUATION_V2_VERSION,
    scoreStatus: 'FINAL',
    scoringBasis: 'RELAY_MARK_PRICE_PATH',
    decisionClass: decisionClass(output.decision),
    side: output.side,
    horizons,
    decisionEvaluation,
    notes: [
      'ENTER direction is scored separately from WAIT/NO_TRADE opportunity and management path quality.',
      'TP/SL and trigger timing use sampled relay mark-price path, not tick-perfect exchange events.',
      'No scalar strategy score is assigned in eval-v2.',
    ],
  };
  const thirty = horizons['30m'];
  const isAbstention =
    output.decision === 'WAIT_TRIGGER' || output.decision === 'NO_TRADE';
  return {
    scorePayload: JSON.stringify(score),
    signedReturnBps30m:
      output.decision === 'ENTER_NOW' ? thirty.signedReturnBps : null,
    directionCorrect30m:
      output.decision === 'ENTER_NOW' && thirty.directionCorrect !== null
        ? thirty.directionCorrect
          ? 1
          : 0
        : null,
    opportunityBps30m: isAbstention ? thirty.opportunityBps : null,
  };
}

'''
          if 'function scoreRunV2FromOutcome' not in text:
              text = text.replace(score_anchor, v2_scorer + score_anchor, 1)
          # Branch inside scoreRun after finalized outcome check.
          branch_anchor = """  if (!outcome || outcome.finalizedAt === null) {\n    throw new Error('REPLAY_OUTCOME_NOT_FINALIZED');\n  }\n\n  const horizons = {"""
          branch_new = """  if (!outcome || outcome.finalizedAt === null) {\n    throw new Error('REPLAY_OUTCOME_NOT_FINALIZED');\n  }\n  if (run.evaluatorVersion === EVALUATION_V2_VERSION)\n    return scoreRunV2FromOutcome(outcome, output);\n\n  const horizons = {"""
          if branch_anchor not in text:
              raise SystemExit('missing scoreRun finalized anchor')
          text = text.replace(branch_anchor, branch_new, 1)
          p.write_text(text, encoding='utf-8')

          # Tests using SQLite need migration 0012 applied after 0008.
          for path in [
              'tests/unit/worker.phase16-replay.test.ts',
              'tests/unit/worker.phase16-eval.test.ts',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              anchor = """    database.exec(\n      readFileSync('worker/migrations/0008_replay_eval_lab.sql', 'utf8'),\n    );"""
              if anchor in text and '0012_evaluation_v2.sql' not in text:
                  text = text.replace(
                      anchor,
                      anchor + """\n    database.exec(\n      readFileSync('worker/migrations/0012_evaluation_v2.sql', 'utf8'),\n    );""",
                      1,
                  )
              p.write_text(text, encoding='utf-8')

          # OpenAPI: structured trigger telemetry contract; research endpoints are not GPT Actions.
          p = Path('worker/openapi/openapi.json')
          doc = json.loads(p.read_text(encoding='utf-8'))
          doc['info']['version'] = '5.5.0'
          schemas = doc['components']['schemas']
          schemas['StructuredTriggerContract'] = {
              'type': 'object',
              'additionalProperties': False,
              'required': [
                  'authoredBy', 'triggerId', 'decisionId', 'sourceSnapshotId',
                  'triggerType', 'referencePrice', 'triggerCondition', 'triggerPrice',
                  'confirmWindowSec', 'invalidationCondition', 'invalidationPrice',
                  'expiresAt', 'maxChaseBps'
              ],
              'properties': {
                  'authoredBy': {'type': 'string', 'const': 'GPT'},
                  'triggerId': {'type': 'string'},
                  'decisionId': {'type': 'string'},
                  'sourceSnapshotId': {'type': 'string'},
                  'triggerType': {'type': 'string', 'enum': ['PRICE_CROSS','PRICE_RECLAIM','BREAKOUT_CONFIRM','PULLBACK_HOLD']},
                  'referencePrice': {'type': 'string', 'const': 'MARK_PRICE'},
                  'triggerCondition': {'type': 'string', 'enum': ['AT_OR_ABOVE','AT_OR_BELOW']},
                  'triggerPrice': {'type': 'number', 'exclusiveMinimum': 0},
                  'confirmWindowSec': {'type': 'integer', 'minimum': 0, 'maximum': 300},
                  'invalidationCondition': {'type': 'string', 'enum': ['AT_OR_ABOVE','AT_OR_BELOW']},
                  'invalidationPrice': {'type': 'number', 'exclusiveMinimum': 0},
                  'expiresAt': {'type': 'integer', 'minimum': 1},
                  'maxChaseBps': {'type': 'number', 'minimum': 0, 'maximum': 1000},
              },
          }
          decision_record = schemas['DecisionRecord']['properties']
          decision_record['triggerContract'] = {
              'oneOf': [
                  {'$ref': '#/components/schemas/StructuredTriggerContract'},
                  {'type': 'null'},
              ],
              'description': 'For WAIT_TRIGGER, the exact GPT-authored mechanical trigger contract shown to the user and eligible for explicit app approval. Omit or null for other decisions.',
          }
          p.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # GPT telemetry must store the exact same WAIT contract.
          p = Path('worker/openapi/GPT_INSTRUCTIONS.md')
          text = p.read_text(encoding='utf-8')
          old = "- trigger/invalidation은 짧은 객관 조건, reason/counterThesis는 짧은 tag만. chain-of-thought/전체대화/PII/API secret/account·order ID/raw private response 금지."
          new = "- WAIT_TRIGGER이면 사용자에게 제시한 동일 `triggerContract`를 recordDecision에도 그대로 넣는다. trigger/invalidation 요약은 짧게, reason/counterThesis는 tag만 남긴다. chain-of-thought/전체대화/PII/API secret/account·order ID/raw private response 금지."
          if old not in text:
              raise SystemExit('missing GPT telemetry instruction anchor')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Format changed files
        run: >-
          npx prettier --write
          worker/src/phase16-replay.ts
          worker/src/phase16-eval.ts
          worker/src/phase13.ts
          worker/src/evaluation-v2.ts
          worker/openapi/openapi.json
          worker/openapi/GPT_INSTRUCTIONS.md
          tests/unit/worker.phase16-replay.test.ts
          tests/unit/worker.phase16-eval.test.ts
          tests/unit/evaluation-v2.test.ts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker tests
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "feat: wire Evaluation V2 replay and scoring"
          git push origin HEAD:agent/evaluation-v2
