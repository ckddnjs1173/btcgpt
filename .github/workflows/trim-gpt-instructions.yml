name: Temporary GPT Instruction Trim

on:
  push:
    branches:
      - agent/evaluation-v2

permissions:
  contents: write

jobs:
  trim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/evaluation-v2
      - name: Trim redundant wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/openapi/GPT_INSTRUCTIONS.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "- WAIT_TRIGGER이면 사용자에게 제시한 동일 `triggerContract`를 recordDecision에도 그대로 넣는다. trigger/invalidation 요약은 짧게, reason/counterThesis는 tag만 남긴다. chain-of-thought/전체대화/PII/API secret/account·order ID/raw private response 금지.",
              "- WAIT_TRIGGER은 사용자에게 제시한 동일 `triggerContract`를 recordDecision에도 넣는다. 요약/tag만 짧게 남기고 chain-of-thought·PII·secret·account/order ID·raw private response는 저장하지 않는다.",
              1,
          )
          text = text.replace(
              "- `getLatestSnapshot`은 compact Decision Context에 판단에 꼭 필요한 상세 사실이 없을 때만 detail/debug fallback으로 호출한다. 충분한 경우 습관적으로 이중 호출하지 않는다.",
              "- `getLatestSnapshot`은 필요한 상세 사실이 없을 때만 detail/debug fallback으로 호출한다. 충분하면 이중 호출하지 않는다.",
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit trim
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/openapi/GPT_INSTRUCTIONS.md
          git commit -m "docs: keep GPT instructions within editor limit" || exit 0
          git push origin HEAD:agent/evaluation-v2
