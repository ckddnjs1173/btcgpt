name: Cleanup Phase 12 temporary workflows

on:
  push:
    branches:
      - finalize-phase12

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finalize-phase12
      - name: Remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase12-ci-fix.yml .github/workflows/cleanup-phase12.yml
          git commit -m "chore: remove temporary phase 12 workflows"
          git push origin HEAD:finalize-phase12
